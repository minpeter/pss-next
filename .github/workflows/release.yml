name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install sandbox prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap procps util-linux
          sudo mv /usr/bin/bwrap /usr/bin/bwrap.real
          sudo tee /usr/bin/bwrap >/dev/null <<'EOF'
          #!/bin/bash
          args=()
          for argument in "$@"; do
            if [[ "$argument" != "--unshare-net" ]]; then
              args+=("$argument")
            fi
          done
          kill_tree() {
            local parent=$1 child
            while read -r child; do
              if [[ -n "$child" ]]; then
                kill_tree "$child"
              fi
            done < <(pgrep -P "$parent" 2>/dev/null || true)
            sudo kill -KILL "$parent" 2>/dev/null || true
          }
          sudo /usr/bin/unshare --net --fork /usr/bin/bwrap.real "${args[@]}" &
          child=$!
          trap 'kill_tree "$child"; exit 143' TERM INT HUP
          wait "$child"
          EOF
          sudo chmod 0755 /usr/bin/bwrap
          /usr/bin/bwrap --unshare-net --ro-bind / / --dev /dev --proc /proc -- /usr/bin/env true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package boundaries
        run: pnpm boundaries

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        env:
          PSS_TASK_VALIDATOR_NETWORK_ISOLATED: "1"
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify release artifacts
        run: pnpm verify:release

      - name: Version or publish packages
        run: pnpm tegami ci
        env:
          # npm publish is authenticated by npm Trusted Publishing/OIDC.
          # Configure each package on npm with repository minpeter/pss-runtime
          # and workflow filename release.yml; do not add NPM_TOKEN.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
