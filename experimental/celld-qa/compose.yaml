services:
  localstack:
    image: localstack/localstack:4.8.1
    ports:
      - "127.0.0.1:${CELLD_QA_S3_PORT:-14566}:4566"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      EAGER_SERVICE_LOADING: "1"
      SERVICES: s3
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:4566/_localstack/health |
          grep -Eq '"s3"[[:space:]]*:[[:space:]]*"(available|running)"'
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    stop_grace_period: 10s

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "127.0.0.1:${CELLD_QA_TOXIPROXY_CONTROL_PORT:-18474}:8474"
      - "127.0.0.1:${CELLD_QA_TOXIPROXY_DATA_PORT:-14666}:8666"
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: [CMD, /toxiproxy-cli, list]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s

  fault-proxy:
    image: oven/bun:1.4.0
    network_mode: host
    working_dir: /workspace
    volumes:
      - ../..:/workspace:ro
    command:
      - bun
      - experimental/celld-qa/src/fault-proxy-server.ts
      - --upstream
      - http://127.0.0.1:${CELLD_QA_TOXIPROXY_DATA_PORT:-14666}
      - --data-port
      - ${CELLD_QA_FAULT_PROXY_PORT:-14567}
      - --control-port
      - ${CELLD_QA_FAULT_CONTROL_PORT:-14568}
    depends_on:
      toxiproxy:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - >-
          fetch('http://127.0.0.1:${CELLD_QA_FAULT_CONTROL_PORT:-14568}/generation')
          .then(response => process.exit(response.ok ? 0 : 1))
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
