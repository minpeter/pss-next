core:changelogs:
  - content: "---\npackages:\n  npm:@minpeter/pss-runtime:\n    type: patch\n  npm:@minpeter/pss-coding-agent:\n    type: patch\n---\n\n## Add speculative background compaction\n\nReplace the legacy auto-compaction options with a callable compaction policy\nand add a speculative strategy that prepares summaries before promotion.\nPreserve overflow recovery, hook interception, and stale-commit protection.\n"
    filename: 2026-08-03-speculative-background-compaction.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@minpeter/pss-extension-latex:\n    type: patch\n---\n\n## Increase the default LaTeX display size\n\nRender display formulas at a more readable terminal size while preserving high-resolution source images and user scale overrides.\n"
    filename: 2026-08-03-latex-display-size.md
    v: 0.0.0
