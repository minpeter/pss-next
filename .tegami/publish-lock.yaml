core:changelogs:
  - content: "---\npackages:\n  npm:@minpeter/pss-coding-agent:\n    type: patch\n  npm:@minpeter/pss-extension-web:\n    type: patch\n---\n\n## Cancel in-flight web tool requests\n\nForward coding-agent abort signals to web search and page fetch clients so active network work can stop promptly.\n"
    filename: 2026-09-03-web-abort-inflight.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@minpeter/pss-coding-agent:\n    type: patch\n---\n\n## Re-verify workspace containment at mutation time\n\nWorkspace mutations re-canonicalize the nearest existing ancestor immediately\nbefore writing or deleting, so an intermediate directory swapped for an\nescaping symlink between resolution and mutation now fails closed instead of\nwriting or deleting outside the workspace.\n"
    filename: 2026-09-03-workspace-symlink-swap.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@minpeter/pss-runtime:\n    type: patch\n---\n\n## Fail closed on missing checkpoints\n\nCheckpoint adapters now surface checkpoint corruption when authoritative run metadata references a missing checkpoint, preventing resume from silently restarting at step one.\n"
    filename: 2026-09-03-checkpoint-fail-closed.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@minpeter/pss-runtime:\n    type: patch\n---\n\n## Keep restarted drain turns successful\n\nWait for a requested queue-drain restart before settling joined callers, so a\nqueued turn cannot receive a failure and then execute anyway.\n"
    filename: 2026-09-03-drain-restart-race.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@minpeter/pss-runtime:\n    type: patch\n---\n\n## Support web and edge runtime timers\n\nGuard detached compaction timer `unref` calls so numeric web timer handles do not crash summary startup or cleanup.\n"
    filename: 2026-09-03-edge-timer-unref.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:@minpeter/pss-runtime:\n    type: patch\n---\n\n## Let the TUI exit while selectors are pending\n\nCancel pending model and session selector waits when exit is requested so catalog loading or an open picker cannot keep the process alive.\n"
    filename: 2026-09-03-tui-exit-hang.md
    v: 0.0.0
